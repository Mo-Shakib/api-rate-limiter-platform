name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rate_limit_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rate_limit_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      ENV: ci
      APP_NAME: rate-limit-platform
      APP_SECRET: ci-super-secret
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rate_limit_db
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .

      - name: Run migrations
        run: |
          alembic upgrade head

      - name: Tests
        run: |
          pytest -q